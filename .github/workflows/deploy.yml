name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # or your version

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy files to production server
        uses: burnett01/rsync-deployments@v9
        with:
          # rsync --delete, not scp: scp only copies INTO the target and never
          # removes what is no longer in dist/. Vite content-hashes every
          # bundle, so each build emits new filenames and the previous
          # generation stayed on the server forever.
          #
          # No -p, plus --omit-dir-times: the webroot is root:deployers and the
          # deploy user writes inside it without owning it, so preserving
          # directory permissions or times returns EPERM and exits 23 — a
          # successful transfer reported as a failed build.
          #
          # .well-known is excluded: it can hold hand-placed NIP-05
          # (nostr.json) and ACME files that are not part of any build.
          switches: -rlt --omit-dir-times --delete --exclude='.well-known/'
          path: dist/
          remote_path: ${{ secrets.PROD_PATH }}
          remote_host: ${{ secrets.PROD_HOST }}
          remote_port: ${{ secrets.PROD_PORT }}
          remote_user: ${{ secrets.PROD_USER }}
          remote_key: ${{ secrets.PROD_SSH_KEY }}

